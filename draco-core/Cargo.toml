[package]
name = "draco-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Postgres connection engine, introspection queries and local storage for Draco, independent of any GUI toolkit"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
russh = "0.45"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "1"
directories = "6"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
keyring = "4"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", features = ["crypto-rust"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
