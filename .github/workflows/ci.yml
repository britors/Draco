name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  rust:
    name: Rust, Tauri and GTK fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux development libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev
          libgtksourceview-5-dev libayatana-appindicator3-dev libxdo-dev
          libssl-dev librsvg2-dev gettext
      - name: Select current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup override set stable
      - name: Check formatting of migrated crates
        run: cargo fmt --check -p draco-app -p draco-tauri
      - name: Lint supported workspace
        run: cargo clippy --locked --workspace --exclude draco-gtk --all-targets -- -D warnings
      - name: Test supported workspace
        run: cargo test --locked --workspace --exclude draco-gtk
      - name: Build official Tauri binary
        run: cargo build --locked -p draco-tauri
      - name: Keep GTK rollback frontend compilable
        run: cargo check --locked -p draco-gtk
