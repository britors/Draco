name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-frontend:
    name: Rust, Tauri smoke and frontend contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust formatting for migrated crates
        run: cargo fmt --check -p draco-app -p draco-tauri

      - name: Rust lint
        run: cargo clippy --workspace --exclude draco-gtk --all-targets -- -D warnings

      - name: Rust tests and Tauri smoke tests
        run: cargo test --workspace --exclude draco-gtk

      - name: Frontend syntax and contract tests
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

  gtk-transition:
    name: Legacy GTK transition build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK transition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libadwaita-1-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Keep GTK frontend compilable during stabilization
        run: cargo check -p draco-gtk
