name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend component, visual and distribution contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  rust:
    name: Rust and Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux development libraries
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          libxdo-dev libssl-dev librsvg2-dev desktop-file-utils appstream
      - name: Select current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup override set stable
      - name: Check formatting
        run: cargo fmt --check -p draco-app -p draco-tauri
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Build official Tauri binary
        run: cargo build --locked -p draco-tauri
      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate data/org.lyraos.Draco.desktop
          appstreamcli validate --no-net data/org.lyraos.Draco.metainfo.xml
      - name: Smoke test installed package layout and linked libraries
        run: |
          install_root="$RUNNER_TEMP/postgres-draco-root"
          install -Dm755 target/debug/draco "$install_root/usr/bin/draco"
          install -Dm644 data/org.lyraos.Draco.desktop "$install_root/usr/share/applications/org.lyraos.Draco.desktop"
          install -Dm644 data/org.lyraos.Draco.metainfo.xml "$install_root/usr/share/metainfo/org.lyraos.Draco.metainfo.xml"
          install -Dm644 logo-new.png "$install_root/usr/share/icons/hicolor/1024x1024/apps/org.lyraos.Draco.png"
          test -x "$install_root/usr/bin/draco"
          test -s "$install_root/usr/share/applications/org.lyraos.Draco.desktop"
          test -s "$install_root/usr/share/metainfo/org.lyraos.Draco.metainfo.xml"
          test -s "$install_root/usr/share/icons/hicolor/1024x1024/apps/org.lyraos.Draco.png"
          ! ldd "$install_root/usr/bin/draco" | grep -F 'not found'
