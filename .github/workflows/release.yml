name: Release packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: release
        name: Match tag and manifests
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $REQUESTED_TAG" >&2
            exit 1
          fi

          version="${REQUESTED_TAG#v}"
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          frontend_version="$(jq -r .version frontend/package.json)"
          tauri_version="$(jq -r .version src-tauri/tauri.conf.json)"
          tag_commit="$(git rev-list -n 1 "$REQUESTED_TAG")"

          test "$version" = "$workspace_version"
          test "$version" = "$frontend_version"
          test "$version" = "$tauri_version"
          test "$tag_commit" = "$(git rev-parse HEAD)"

          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows-nsis:
    name: Windows x64 · NSIS
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version $env:TAURI_CLI_VERSION --locked
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis --ci -- --locked
      - name: Give installer a stable release name
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $packages = @(Get-ChildItem "target/release/bundle/nsis/*.exe")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($packages.Count)"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $packages[0].FullName "dist/Draco_${env:VERSION}_windows_x64-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-nsis
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  debian-deb:
    name: Ubuntu 24.04 x64 · DEB
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Tauri and Debian packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          libxdo-dev libssl-dev librsvg2-dev file patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build Debian package
        run: cargo tauri build --bundles deb --ci -- --locked
      - name: Verify desktop icon is packaged at a standard size
        run: |
          set -euo pipefail
          package="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb -c "$package" > package-contents.txt
          grep -q 'usr/share/icons/hicolor/32x32/apps/draco.png' package-contents.txt
          grep -q 'usr/share/icons/hicolor/512x512/apps/draco.png' package-contents.txt
          ! grep -q 'usr/share/icons/hicolor/2720x2720/apps/draco.png' package-contents.txt
          dpkg-deb --fsys-tarfile "$package" | tar -xOf - usr/share/applications/Draco.desktop > package.desktop
          grep -qx 'Icon=draco' package.desktop
      - name: Give package a stable release name
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          install -Dm644 "${packages[0]}" "dist/draco_${VERSION}_ubuntu24.04_amd64.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  fedora-rpm:
    name: Fedora 43 x64 · RPM
    needs: validate
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 60
    steps:
      - name: Install build and packaging dependencies
        run: >-
          dnf install --assumeyes git curl gcc gcc-c++ make pkgconf-pkg-config
          webkit2gtk4.1-devel gtk3-devel openssl-devel librsvg2-devel
          libappindicator-gtk3-devel rpm-build file cpio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build Fedora RPM
        run: cargo tauri build --bundles rpm --ci -- --locked
      - name: Verify desktop icon is packaged at a standard size
        run: |
          set -euo pipefail
          package="$(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$package"
          rpm -qlp "$package" > package-contents.txt
          grep -q '/usr/share/icons/hicolor/32x32/apps/draco.png' package-contents.txt
          grep -q '/usr/share/icons/hicolor/512x512/apps/draco.png' package-contents.txt
          ! grep -q '/usr/share/icons/hicolor/2720x2720/apps/draco.png' package-contents.txt
          rpm2cpio "$package" | cpio --quiet -i --to-stdout ./usr/share/applications/Draco.desktop > package.desktop
          grep -qx 'Icon=draco' package.desktop
      - name: Give package a distribution-specific name
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm')
          test "${#packages[@]}" -eq 1
          install -Dm644 "${packages[0]}" "dist/draco_${VERSION}_fedora43_x86_64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  opensuse-rpm:
    name: openSUSE Leap 16.0 x64 · RPM
    needs: validate
    runs-on: ubuntu-24.04
    container: opensuse/leap:16.0
    timeout-minutes: 60
    steps:
      - name: Install build and packaging dependencies
        run: >-
          zypper --non-interactive install git-core curl gcc gcc-c++ make pkgconf-pkg-config
          rust cargo cpio
          rpm-build file 'pkgconfig(webkit2gtk-4.1)' 'pkgconfig(gtk+-3.0)'
          'pkgconfig(openssl)' 'pkgconfig(librsvg-2.0)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      # Use Leap's supported toolchain inside this minimal container. The rustup
      # composite action loses the system PATH between its internal steps here.
      - name: Validate distribution Rust toolchain
        run: cargo --version && rustc --version
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build openSUSE RPM
        run: cargo tauri build --bundles rpm --ci -- --locked
      - name: Verify desktop icon is packaged at a standard size
        run: |
          set -euo pipefail
          package="$(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$package"
          rpm -qlp "$package" > package-contents.txt
          grep -q '/usr/share/icons/hicolor/32x32/apps/draco.png' package-contents.txt
          grep -q '/usr/share/icons/hicolor/512x512/apps/draco.png' package-contents.txt
          ! grep -q '/usr/share/icons/hicolor/2720x2720/apps/draco.png' package-contents.txt
          rpm2cpio "$package" | cpio --quiet -i --to-stdout ./usr/share/applications/Draco.desktop > package.desktop
          grep -qx 'Icon=draco' package.desktop
      - name: Give package a distribution-specific name
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm')
          test "${#packages[@]}" -eq 1
          install -Dm644 "${packages[0]}" "dist/draco_${VERSION}_opensuse-leap16.0_x86_64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opensuse-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs: [validate, windows-nsis, debian-deb, fedora-rpm, opensuse-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create release or attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Draco ${RELEASE_TAG#v}"
          fi
