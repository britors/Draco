    <radialGradient id="iris" cx="48%" cy="58%" r="64%"><stop stop-color="#fff4a0"/><stop offset=".34" stop-color="#ffbc36"/><stop offset=".72" stop-color="#e05220"/><stop offset="1" stop-color="#7d1e25"/></radialGradient>
